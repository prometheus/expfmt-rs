[package]
name = "expfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Prometheus and OpenMetrics wire exposition format decoders"
license = "Apache-2.0"
repository = "https://github.com/prometheus/expfmt-rs"
keywords = ["prometheus", "openmetrics", "metrics", "opentelemetry", "arrow"]
categories = ["parser-implementations", "encoding"]

[workspace]
exclude = ["tests/otap-compat"]

[features]
default = ["arrow", "dto"]
arrow = [
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-schema",
    "dep:otel-arrow-dfe-pdata-views",
]
dto = ["dep:prost", "dep:prost-types"]

[dependencies]
arrow-array = { version = "59", default-features = false, optional = true }
arrow-buffer = { version = "59", default-features = false, optional = true }
arrow-schema = { version = "59", default-features = false, optional = true }
otel-arrow-dfe-pdata-views = { version = "0.54", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
thiserror = "2"

[dev-dependencies]
benchfmt = { git = "https://github.com/bwplotka/benchfmt.rs" }
prost-build = "=0.14.4"
protox = "0.10"

[[bench]]
name = "decode"
harness = false
required-features = ["arrow"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
