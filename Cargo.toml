[package]
name = "expfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Prometheus and OpenMetrics wire exposition format decoders"
license = "Apache-2.0"
repository = "https://github.com/prometheus/expfmt-rs"
keywords = ["prometheus", "openmetrics", "metrics", "opentelemetry", "arrow"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["arrow", "dto"]
arrow = []
dto = ["dep:prost", "dep:prost-types"]

[dependencies]
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
thiserror = "2"

[dev-dependencies]
prost-build = "0.14"
protox = "0.10"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
