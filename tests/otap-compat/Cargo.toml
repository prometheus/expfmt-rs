[package]
name = "expfmt-otap-compat"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone workspace isolating `otel-arrow-dfe-pdata` from the root `expfmt` crate.
# Upstream `otel-arrow-dfe-pdata` has no feature flag to disable `datafusion`, `tonic`, `tokio`,
# `nix`, and `zstd`, so resolving it pulls ~380 transitive crates (~5.3k lines in `Cargo.lock`)
# and requires MSRV 1.94 versus `expfmt`'s MSRV 1.88.
#
# Per Rust's lockfile guidance (https://blog.rust-lang.org/2023/08/29/committing-lockfiles/),
# root `Cargo.lock` stays committed to pin MSRV 1.88 and byte-exact `prost-build` checks, while
# `tests/otap-compat/Cargo.lock` is gitignored so `stable` CI tests compatibility against the
# latest `0.62.x` `otel-arrow-dfe-pdata` graph without checking in a 5k-line lockfile.
[workspace]

[dev-dependencies]
dhat = "0.3"
expfmt = { path = "../..", default-features = false, features = ["arrow"] }
otel-arrow-dfe-pdata = { version = "0.62", features = ["testing"] }
tokio = { version = "1.48", default-features = false, features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
